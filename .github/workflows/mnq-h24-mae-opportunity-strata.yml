name: MNQ H24 MAE opportunity-strata diagnostic

on:
  pull_request:
    paths:
      - 'research/mnq_h24_mae_opportunity_strata.py'
      - '.github/workflows/mnq-h24-mae-opportunity-strata.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn tzdata
      - name: Fetch pinned corrected deep MNQ corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/MNQ_DATA
          git -C vendor/MNQ_DATA init
          git -C vendor/MNQ_DATA remote add origin https://github.com/mbytes21/MNQ_DATA.git
          git -C vendor/MNQ_DATA fetch --depth=1 origin fc5508e2c152938d6d9eb70a36b888ae26107176
          git -C vendor/MNQ_DATA checkout --detach FETCH_HEAD
          test "$(git -C vendor/MNQ_DATA rev-parse HEAD)" = "fc5508e2c152938d6d9eb70a36b888ae26107176"
      - name: Fetch pinned independent AXB corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/cme-futures-ohlc
          git -C vendor/cme-futures-ohlc init
          git -C vendor/cme-futures-ohlc remote add origin https://github.com/axb0306/cme-futures-ohlc.git
          git -C vendor/cme-futures-ohlc fetch --depth=1 origin 60abd3fb6369c6ce0b6a4a65b0f2562fc96b1264
          git -C vendor/cme-futures-ohlc checkout --detach FETCH_HEAD
          test "$(git -C vendor/cme-futures-ohlc rev-parse HEAD)" = "60abd3fb6369c6ce0b6a4a65b0f2562fc96b1264"
      - name: Execute all frozen Ridge opportunity strata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mae-opportunity-strata
          python -m research.mnq_h24_mae_opportunity_strata \
            --deep-root vendor/MNQ_DATA/plaintext_csv \
            --axb-root vendor/cme-futures-ohlc \
            --output artifacts/mae-opportunity-strata/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: mnq-h24-mae-opportunity-strata
          path: artifacts/mae-opportunity-strata/receipt.json
          if-no-files-found: error
          retention-days: 30
