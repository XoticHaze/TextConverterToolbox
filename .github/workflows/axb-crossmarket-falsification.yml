name: axb-crossmarket-falsification

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/axb-crossmarket-falsification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned public AXB source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/axb0306/cme-futures-ohlc.git axb
          git -C axb checkout --detach 60abd3fb6369c6ce0b6a4a65b0f2562fc96b1264
          test "$(git -C axb rev-parse HEAD)" = "60abd3fb6369c6ce0b6a4a65b0f2562fc96b1264"
          echo 'AXB_PIN=PASS'

      - name: Install bounded research dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check -q pandas numpy scikit-learn

      - name: Run causal cross-market falsification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          python - <<'PY'
          import glob, json, math, hashlib
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from sklearn.linear_model import LogisticRegression
          from sklearn.ensemble import HistGradientBoostingClassifier
          from sklearn.metrics import accuracy_score, balanced_accuracy_score, f1_score
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import StandardScaler

          ROOTS = ['CL','GC','MNQ','NQ','ZN']
          FEATURES = [
              'ret_1','ret_3','ret_6','ret_12','range_frac','body_frac',
              'log_volume','volume_z_24','volume_z_120','rv_12','rv_60',
              'ema12_dist','ema48_dist','mom_24','mom_120','minute_density',
              'hour_sin','hour_cos','dow_sin','dow_cos',
          ]
          PIN='60abd3fb6369c6ce0b6a4a65b0f2562fc96b1264'

          def make_matrix(path):
              f=pd.read_csv(path)
              required=['datetime','open','high','low','close','volume']
              if list(f.columns) != required:
                  raise RuntimeError(f'{path}: unexpected schema {list(f.columns)}')
              f['timestamp']=pd.to_datetime(f['datetime'], utc=True, errors='raise')
              for c in ['open','high','low','close','volume']:
                  f[c]=pd.to_numeric(f[c], errors='raise')
              f=f.sort_values('timestamp').drop_duplicates('timestamp', keep=False)
              if not f['timestamp'].is_monotonic_increasing:
                  raise RuntimeError(f'{path}: timestamps not monotonic')
              w=f.set_index('timestamp')
              b=w.resample('12min', origin='start_day', label='left', closed='left').agg(
                  open=('open','first'), high=('high','max'), low=('low','min'), close=('close','last'),
                  volume=('volume','sum'), observed_minutes=('close','count'))
              b=b[b['observed_minutes']>0].reset_index()
              close=b['close'].astype(float)
              log_close=np.log(close)
              ret1=log_close.diff()
              for lag in (1,3,6,12): b[f'ret_{lag}']=log_close.diff(lag)
              b['range_frac']=(b['high']-b['low'])/close.replace(0,np.nan)
              b['body_frac']=(b['close']-b['open'])/b['open'].replace(0,np.nan)
              b['log_volume']=np.log1p(b['volume'].clip(lower=0))
              for window in (24,120):
                  mean=b['log_volume'].rolling(window,min_periods=window).mean()
                  std=b['log_volume'].rolling(window,min_periods=window).std(ddof=0).replace(0,np.nan)
                  b[f'volume_z_{window}']=(b['log_volume']-mean)/std
              b['rv_12']=ret1.rolling(12,min_periods=12).std(ddof=0)
              b['rv_60']=ret1.rolling(60,min_periods=60).std(ddof=0)
              for span in (12,48):
                  ema=close.ewm(span=span,adjust=False,min_periods=span).mean()
                  b[f'ema{span}_dist']=close/ema-1.0
              b['mom_24']=close.pct_change(24)
              b['mom_120']=close.pct_change(120)
              b['minute_density']=b['observed_minutes'].clip(upper=12)/12.0
              hour=b['timestamp'].dt.hour+b['timestamp'].dt.minute/60.0
              b['hour_sin']=np.sin(2*math.pi*hour/24.0); b['hour_cos']=np.cos(2*math.pi*hour/24.0)
              dow=b['timestamp'].dt.dayofweek
              b['dow_sin']=np.sin(2*math.pi*dow/7.0); b['dow_cos']=np.cos(2*math.pi*dow/7.0)
              future=close.shift(-12)
              b['target']=np.where(future.notna(),(future>close).astype(int),np.nan)
              out=b[['timestamp',*FEATURES,'target']].replace([np.inf,-np.inf],np.nan).dropna().reset_index(drop=True)
              out['target']=out['target'].astype(int)
              return out, len(f), len(b)

          def folds(n):
              first=n//2; size=(n-first)//4; out=[]
              if size < 300: raise RuntimeError(f'insufficient fold size {size}')
              for i in range(4):
                  ts=first+i*size; te=n if i==3 else first+(i+1)*size; tr_end=ts-12
                  if tr_end <= 1000: raise RuntimeError('insufficient train rows')
                  out.append((0,tr_end,ts,te))
              return out

          def score(y,p):
              return {'accuracy':float(accuracy_score(y,p)), 'balanced_accuracy':float(balanced_accuracy_score(y,p)), 'macro_f1':float(f1_score(y,p,average='macro'))}

          results={'schema':'foundry.axb_crossmarket_falsification.v1','source_repo':'axb0306/cme-futures-ohlc','source_commit':PIN,
                   'research_only':True,'promotion_authority':False,'feature_contract':'foundry.external_mnq_causal_features.v1',
                   'target_contract':'forward_12bar_close_direction.v1','roots':{}}
          for root in ROOTS:
              matches=glob.glob(f'axb/{root}/{root}_1min_*.csv')
              if len(matches)!=1: raise RuntimeError(f'{root}: expected one pinned 1min file, got {matches}')
              frame, source_rows, bars=make_matrix(matches[0])
              fs=folds(len(frame)); X=frame[FEATURES].to_numpy(float); y=frame['target'].to_numpy(int)
              oos_idx=np.concatenate([np.arange(a,b) for _,_,a,b in fs])
              maj=int(pd.Series(y[:fs[0][1]]).mode().iloc[0])
              baselines={
                  'majority':score(y[oos_idx],np.full(len(oos_idx),maj,dtype=int)),
                  'ret1_sign':score(y[oos_idx],(frame['ret_1'].to_numpy()[oos_idx]>0).astype(int)),
              }
              models={}
              specs={
                  'logistic_regression':lambda:Pipeline([('scale',StandardScaler()),('model',LogisticRegression(max_iter=1500,class_weight='balanced',random_state=42))]),
                  'hist_gradient_boosting':lambda:HistGradientBoostingClassifier(max_iter=220,learning_rate=0.05,max_leaf_nodes=31,l2_regularization=1.0,random_state=42),
              }
              for name,factory in specs.items():
                  preds=[]; truth=[]; fold_metrics=[]
                  for fold,(s,e,ts,te) in enumerate(fs):
                      m=factory(); m.fit(X[s:e],y[s:e]); p=m.predict(X[ts:te])
                      fold_metrics.append({'fold':fold,'train_rows':e-s,'test_rows':te-ts,**score(y[ts:te],p)})
                      preds.append(p); truth.append(y[ts:te])
                  models[name]={'aggregate':score(np.concatenate(truth),np.concatenate(preds)),'folds':fold_metrics}
              results['roots'][root]={
                  'source_file':Path(matches[0]).name,'source_rows':source_rows,'bars_12min':bars,'training_rows':len(frame),
                  'first_timestamp':frame['timestamp'].iloc[0].isoformat(),'last_timestamp':frame['timestamp'].iloc[-1].isoformat(),
                  'target_up_rate':float(frame['target'].mean()),'oos_rows':int(len(oos_idx)),'baselines':baselines,'models':models,
              }
              print(root, json.dumps(results['roots'][root], sort_keys=True))
          material=json.dumps(results,sort_keys=True,separators=(',',':')).encode()
          results['receipt_sha256']=hashlib.sha256(material).hexdigest()
          Path('result/axb-crossmarket-falsification.json').write_text(json.dumps(results,indent=2,sort_keys=True)+'\n')
          print('AXB_CROSSMARKET_FALSIFICATION=PASS')
          print('RECEIPT_SHA256='+results['receipt_sha256'])
          PY

      - name: Upload metrics only
        uses: actions/upload-artifact@v4
        with:
          name: axb-crossmarket-falsification-results
          path: result/axb-crossmarket-falsification.json
          if-no-files-found: error
          retention-days: 14
