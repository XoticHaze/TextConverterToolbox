name: MNQ multi-resolution foundation

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/mnq_multires_foundation.py'
      - 'research/mnq_multires_foundation_contract_20260901.json'
      - '.github/workflows/mnq-multires-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        config:
          - m1_h30_v05
          - m1_h60_v05
          - h1_h4_v05
          - h1_h12_v05
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate frozen contract and source
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool research/mnq_multires_foundation_contract_20260901.json >/dev/null
          python -m py_compile research/mnq_multires_foundation.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/mnq_multires_foundation_contract_20260901.json').read_text())
          assert d['created_before_outcome_inspection'] is True
          assert d['execution_market'] == 'MNQ'
          assert d['tuning_allowed'] is False
          assert set(d['timeframes']) == {'1min','1h'}
          assert d['nq_boundary'].startswith('NQ is not an input')
          print('MULTIRES_FROZEN_CONTRACT=PASS')
          PY

      - name: Install bounded research dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy scikit-learn tzdata

      - name: Fetch pinned deep MNQ corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/MNQ_DATA
          git -C vendor/MNQ_DATA init
          git -C vendor/MNQ_DATA remote add origin https://github.com/mbytes21/MNQ_DATA.git
          git -C vendor/MNQ_DATA fetch --depth=1 origin fc5508e2c152938d6d9eb70a36b888ae26107176
          git -C vendor/MNQ_DATA checkout --detach FETCH_HEAD
          test "$(git -C vendor/MNQ_DATA rev-parse HEAD)" = "fc5508e2c152938d6d9eb70a36b888ae26107176"
          echo 'DEEP_MNQ_PIN=PASS'

      - name: Execute frozen multi-resolution foundation config
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/multires/${{ matrix.config }}
          python -m research.mnq_multires_foundation \
            --config-key '${{ matrix.config }}' \
            --deep-root vendor/MNQ_DATA/plaintext_csv \
            --output artifacts/multires/${{ matrix.config }}/receipt.json \
            2>&1 | tee artifacts/multires/${{ matrix.config }}/run.log
          rc=${PIPESTATUS[0]}
          echo "MULTIRES_EXIT_CODE=$rc" | tee -a artifacts/multires/${{ matrix.config }}/run.log
          exit "$rc"

      - name: Upload config receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnq-multires-${{ matrix.config }}
          path: |
            artifacts/multires/${{ matrix.config }}/receipt.json
            artifacts/multires/${{ matrix.config }}/run.log
            research/mnq_multires_foundation_contract_20260901.json
          if-no-files-found: warn
          retention-days: 30
