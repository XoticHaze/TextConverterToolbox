name: MNQ H12 Ridge authority audit

on:
  pull_request:
    branches: [assistant/mnq-ridge-h1-risk-budget-r1]
    paths:
      - 'research/mnq_h12_ridge_authority_audit.py'
      - 'research/mnq_h12_ridge_authority_audit_contract_20260901.json'
      - '.github/workflows/mnq-h12-ridge-authority-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate frozen audit contract and source
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool research/mnq_h12_ridge_authority_audit_contract_20260901.json >/dev/null
          python -m py_compile research/mnq_h12_ridge_authority_audit.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/mnq_h12_ridge_authority_audit_contract_20260901.json').read_text())
          assert d['created_before_audit_outcome_inspection'] is True
          p=d['unchanged_ridge_policy']
          assert p['bar_minutes'] == 12
          assert p['horizon_bars'] == 12
          assert p['feature_set'] == 'baseline20'
          assert p['model'] == 'StandardScaler + Ridge(alpha=10)'
          assert p['selection'] == 'prior-only q50 absolute normalized Ridge prediction'
          assert p['point_costs'] == [0.5, 1.0, 2.0, 4.0]
          assert d['promotion_authority'] is False
          assert d['live_authority'] is False
          print('H12_RIDGE_AUTHORITY_AUDIT_CONTRACT=PASS')
          PY

      - name: Install bounded research dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy scikit-learn tzdata

      - name: Fetch pinned deep MNQ corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/MNQ_DATA
          git -C vendor/MNQ_DATA init
          git -C vendor/MNQ_DATA remote add origin https://github.com/mbytes21/MNQ_DATA.git
          git -C vendor/MNQ_DATA fetch --depth=1 origin fc5508e2c152938d6d9eb70a36b888ae26107176
          git -C vendor/MNQ_DATA checkout --detach FETCH_HEAD
          test "$(git -C vendor/MNQ_DATA rev-parse HEAD)" = "fc5508e2c152938d6d9eb70a36b888ae26107176"
          echo 'DEEP_MNQ_PIN=PASS'

      - name: Execute frozen H12 Ridge authority audit
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/h12-ridge-audit
          python -m research.mnq_h12_ridge_authority_audit \
            --deep-root vendor/MNQ_DATA/plaintext_csv \
            --output artifacts/h12-ridge-audit/receipt.json \
            2>&1 | tee artifacts/h12-ridge-audit/run.log
          rc=${PIPESTATUS[0]}
          echo "H12_RIDGE_AUTHORITY_AUDIT_EXIT_CODE=$rc" | tee -a artifacts/h12-ridge-audit/run.log
          exit "$rc"

      - name: Verify provenance and control surface
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/h12-ridge-audit/receipt.json').read_text())
          assert d['deep_timestamp_contract']['source_timestamp_timezone'] == 'America/New_York'
          assert d['deep_timestamp_contract']['normalized_timestamp'] == 'UTC bar start'
          assert len(d['weekly_rows']) >= 80
          assert d['fit_receipts']
          expected={'ridge','same_selected_always_long','same_selected_prior_majority','ridge_long_only','ridge_short_only','sign_flipped_ridge'}
          assert set(d['policy_summary']) == expected
          assert set(d['paired_vs_same_selection_controls']) == {'same_selected_always_long','same_selected_prior_majority'}
          for fit in d['fit_receipts']:
              o=fit['oof']
              assert abs(o['threshold_abs_pred_z'] - o['reproduced_threshold_abs_pred_z']) <= 1e-12
          print('H12_RIDGE_AUTHORITY_AUDIT_PROVENANCE=PASS')
          PY

      - name: Upload audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnq-h12-ridge-authority-audit
          path: |
            artifacts/h12-ridge-audit/receipt.json
            artifacts/h12-ridge-audit/run.log
            research/mnq_h12_ridge_authority_audit_contract_20260901.json
            research/mnq_h12_ridge_authority_audit.py
          if-no-files-found: warn
          retention-days: 30
