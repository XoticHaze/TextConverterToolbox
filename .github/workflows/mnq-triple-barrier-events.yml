name: mnq-triple-barrier-events

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  event-study:
    strategy:
      fail-fast: false
      matrix:
        config: [h12_bar05, h12_bar10, h24_bar05, h24_bar10]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout research harness
        uses: actions/checkout@v4
      - name: Checkout exact deep MNQ source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mbytes21/MNQ_DATA.git deep
          git -C deep checkout --detach fc5508e2c152938d6d9eb70a36b888ae26107176
          test "$(git -C deep rev-parse HEAD)" = "fc5508e2c152938d6d9eb70a36b888ae26107176"
      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check -q pandas numpy scikit-learn
      - name: Execute non-overlapping triple-barrier event study
        env:
          CONFIG_KEY: ${{ matrix.config }}
        shell: bash
        run: |
          set -euo pipefail
          python -m research.mnq_triple_barrier_events \
            --config-key "$CONFIG_KEY" \
            --deep-root deep/plaintext_csv \
            --output "result/${CONFIG_KEY}.json"
      - name: Upload metrics only
        uses: actions/upload-artifact@v4
        with:
          name: mnq-triple-barrier-${{ matrix.config }}
          path: result/${{ matrix.config }}.json
          if-no-files-found: error
          retention-days: 14
