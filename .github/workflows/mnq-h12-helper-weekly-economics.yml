name: MNQ H12 helper weekly economics

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/mnq_h12_helper_weekly_economics.py'
      - 'research/mnq_h12_helper_weekly_economics_contract_20260901.json'
      - '.github/workflows/mnq-h12-helper-weekly-economics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-economics:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate frozen contract and source syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool research/mnq_h12_helper_weekly_economics_contract_20260901.json >/dev/null
          python -m py_compile research/mnq_h12_helper_weekly_economics.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/mnq_h12_helper_weekly_economics_contract_20260901.json')
          d=json.loads(p.read_text())
          assert d['created_before_outcome_inspection'] is True
          assert d['market'] == 'MNQ'
          assert d['base_model']['horizon_rows'] == 12
          assert d['weekly_economic_contract']['minimum_complete_weeks'] == 80
          assert d['nq_boundary'].startswith('NQ is reserved')
          print('FROZEN_CONTRACT=PASS')
          PY

      - name: Install bounded research dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy scikit-learn tzdata

      - name: Fetch pinned deep MNQ corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/MNQ_DATA
          git -C vendor/MNQ_DATA init
          git -C vendor/MNQ_DATA remote add origin https://github.com/mbytes21/MNQ_DATA.git
          git -C vendor/MNQ_DATA fetch --depth=1 origin fc5508e2c152938d6d9eb70a36b888ae26107176
          git -C vendor/MNQ_DATA checkout --detach FETCH_HEAD
          test "$(git -C vendor/MNQ_DATA rev-parse HEAD)" = "fc5508e2c152938d6d9eb70a36b888ae26107176"
          echo 'DEEP_MNQ_PIN=PASS'

      - name: Execute frozen helper weekly economics challenge
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/h12-helper-weekly
          python -m research.mnq_h12_helper_weekly_economics \
            --deep-root vendor/MNQ_DATA/plaintext_csv \
            --output artifacts/h12-helper-weekly/receipt.json \
            2>&1 | tee artifacts/h12-helper-weekly/run.log
          rc=${PIPESTATUS[0]}
          echo "HELPER_WEEKLY_EXIT_CODE=$rc" | tee -a artifacts/h12-helper-weekly/run.log
          exit "$rc"

      - name: Upload research receipt and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnq-h12-helper-weekly-economics
          path: |
            artifacts/h12-helper-weekly/receipt.json
            artifacts/h12-helper-weekly/run.log
            research/mnq_h12_helper_weekly_economics_contract_20260901.json
          if-no-files-found: warn
          retention-days: 30
