name: mnq-external-transfer-validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout research harness
        uses: actions/checkout@v4

      - name: Acquire exact licensed MNQ training source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.kaggle.com/api/v1/datasets/view/brandenmorris/mnq-1m-q4-2022-q4-2025-ts-ohlcv-sym' \
            -o source/metadata.json
          python - <<'PY'
          import json
          d=json.load(open('source/metadata.json', encoding='utf-8'))
          text=json.dumps(d, sort_keys=True)
          if 'CC BY 4.0' not in text:
              raise SystemExit('expected CC BY 4.0 metadata not observed')
          version=d.get('currentVersionNumber') or d.get('versionNumber')
          if str(version) != '1':
              raise SystemExit(f'dataset version drift: {version}')
          PY
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.kaggle.com/api/v1/datasets/download/brandenmorris/mnq-1m-q4-2022-q4-2025-ts-ohlcv-sym' \
            -o source/licensed-mnq.zip
          echo '633eb4338a3aa60aedb542b12085acca29ff237c7cadff65442a638466f37667  source/licensed-mnq.zip' | sha256sum -c -
          unzip -q source/licensed-mnq.zip -d source/licensed
          aggregate="$(find source/licensed -type f -name 'mnq-ohlcv-1m.csv' -print -quit)"
          test -n "$aggregate"
          cp "$aggregate" source/licensed-mnq.csv
          echo 'LICENSED_TRAIN_SOURCE=PASS'

      - name: Acquire independent deep MNQ validation source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mbytes21/MNQ_DATA.git source/deep
          git -C source/deep checkout --detach fc5508e2c152938d6d9eb70a36b888ae26107176
          test "$(git -C source/deep rev-parse HEAD)" = "fc5508e2c152938d6d9eb70a36b888ae26107176"
          test -f 'source/deep/plaintext_csv/MNQ 03-20/20191209.Last.csv'
          echo 'DEEP_EXTERNAL_SOURCE=PASS'

      - name: Install bounded dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check -q pandas numpy scikit-learn

      - name: Execute frozen external-time/source transfer validation
        shell: bash
        run: |
          set -euo pipefail
          python -m research.mnq_external_transfer_validation \
            --licensed-aggregate source/licensed-mnq.csv \
            --deep-root source/deep/plaintext_csv \
            --output result/mnq-external-transfer-validation.json

      - name: Upload metrics only
        uses: actions/upload-artifact@v4
        with:
          name: mnq-external-transfer-validation-results
          path: result/mnq-external-transfer-validation.json
          if-no-files-found: error
          retention-days: 14
