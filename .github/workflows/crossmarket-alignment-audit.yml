name: crossmarket-alignment-audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout research harness
        uses: actions/checkout@v4
      - name: Checkout exact pinned AXB source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/axb0306/cme-futures-ohlc.git axb
          git -C axb checkout --detach 60abd3fb6369c6ce0b6a4a65b0f2562fc96b1264
          test "$(git -C axb rev-parse HEAD)" = "60abd3fb6369c6ce0b6a4a65b0f2562fc96b1264"
      - name: Install bounded dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check -q pandas numpy scikit-learn
      - name: Execute alignment-selection audit
        shell: bash
        run: |
          set -euo pipefail
          python -m research.crossmarket_alignment_audit --source-root axb --output result/crossmarket-alignment-audit.json
      - name: Upload metrics only
        uses: actions/upload-artifact@v4
        with:
          name: crossmarket-alignment-audit-results
          path: result/crossmarket-alignment-audit.json
          if-no-files-found: error
          retention-days: 14
