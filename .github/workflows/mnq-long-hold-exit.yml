name: MNQ long HOLD EXIT specialist

on:
  push:
    branches:
      - assistant/mnq-long-hold-exit-r1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn
      - name: Execute HOLD EXIT target and OOS contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest -v \
            research.test_mnq_long_hold_exit_targets \
            research.test_mnq_long_hold_exit_oos
