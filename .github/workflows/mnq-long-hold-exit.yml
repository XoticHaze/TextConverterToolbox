name: MNQ long HOLD EXIT specialist

on:
  push:
    branches:
      - assistant/mnq-long-hold-exit-r1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scikit-learn tzdata
      - name: Execute focused causal contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest -v \
            research.test_mnq_long_hold_exit_targets \
            research.test_mnq_long_hold_exit_oos
      - name: Checkout exact deep MNQ source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mbytes21/MNQ_DATA.git deep
          git -C deep checkout --detach fc5508e2c152938d6d9eb70a36b888ae26107176
          test "$(git -C deep rev-parse HEAD)" = "fc5508e2c152938d6d9eb70a36b888ae26107176"
      - name: Execute chronological deep-MNQ HOLD EXIT panel
        run: |
          mkdir -p result
          python -m research.run_mnq_long_hold_exit_deep \
            --deep-root deep/plaintext_csv \
            --output result/mnq_long_hold_exit_deep.json
      - name: Upload economic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnq-long-hold-exit-deep
          path: result/mnq_long_hold_exit_deep.json
          if-no-files-found: warn
          retention-days: 30
