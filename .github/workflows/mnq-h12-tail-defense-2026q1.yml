name: MNQ H12 Tail Defense 2026Q1

on:
  pull_request:
    branches: [assistant/mnq-h12-ridge-authority-audit-r1]
    paths:
      - 'research/mnq_h12_tail_defense_holdout_2026q1.py'
      - 'research/mnq_h12_tail_defense_holdout_2026q1_contract.json'
      - '.github/workflows/mnq-h12-tail-defense-2026q1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate frozen contract and code
        run: |
          python -m json.tool research/mnq_h12_tail_defense_holdout_2026q1_contract.json >/dev/null
          python -m py_compile research/mnq_h12_tail_defense_holdout_2026q1.py
          python - <<'PY'
          import json
          d=json.load(open('research/mnq_h12_tail_defense_holdout_2026q1_contract.json'))
          assert d['created_before_outcome_inspection'] is True
          assert d['unchanged_policy']['bar_minutes'] == 12
          assert d['unchanged_policy']['horizon_bars'] == 12
          assert d['unchanged_policy']['feature_set'] == 'baseline20'
          assert d['unchanged_policy']['model'] == 'StandardScaler + Ridge(alpha=10)'
          assert d['unchanged_policy']['selection'] == 'prior-only q50 absolute normalized Ridge prediction'
          assert d['boundaries']['promotion_authority'] is False
          assert d['boundaries']['live_trading_change'] is False
          print('H12_TAIL_DEFENSE_CONTRACT=PASS')
          PY
      - name: Install fixed research dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy scikit-learn tzdata
      - name: Fetch pinned deep MNQ corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/MNQ_DATA
          git -C vendor/MNQ_DATA init
          git -C vendor/MNQ_DATA remote add origin https://github.com/mbytes21/MNQ_DATA.git
          git -C vendor/MNQ_DATA fetch --depth=1 origin fc5508e2c152938d6d9eb70a36b888ae26107176
          git -C vendor/MNQ_DATA checkout --detach FETCH_HEAD
          test "$(git -C vendor/MNQ_DATA rev-parse HEAD)" = "fc5508e2c152938d6d9eb70a36b888ae26107176"
          echo 'DEEP_MNQ_PIN=PASS'
      - name: Execute untouched 2026Q1 tail-defense holdout
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/h12-tail-defense-2026q1
          python -m research.mnq_h12_tail_defense_holdout_2026q1 \
            --deep-root vendor/MNQ_DATA/plaintext_csv \
            --output artifacts/h12-tail-defense-2026q1/receipt.json \
            2>&1 | tee artifacts/h12-tail-defense-2026q1/run.log
          rc=${PIPESTATUS[0]}
          echo "H12_TAIL_DEFENSE_EXIT_CODE=$rc" | tee -a artifacts/h12-tail-defense-2026q1/run.log
          exit "$rc"
      - name: Verify receipt boundary
        if: success()
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/h12-tail-defense-2026q1/receipt.json'))
          assert d['experiment_id']=='MNQ_H12_TAIL_DEFENSE_2026Q1_R1'
          assert d['promotion_authority'] is False
          assert d['holdout']['test_first_timestamp'] >= '2026-01-01'
          assert d['holdout']['train_last_timestamp'] < d['holdout']['test_first_timestamp']
          assert d['boundaries']['strategy_spec_write'] is False
          assert d['boundaries']['runtime_activation'] is False
          assert d['boundaries']['broker_submit'] is False
          assert d['boundaries']['live_trading_change'] is False
          print('H12_TAIL_DEFENSE_RECEIPT_BOUNDARY=PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mnq-h12-tail-defense-2026q1
          path: |
            artifacts/h12-tail-defense-2026q1/receipt.json
            artifacts/h12-tail-defense-2026q1/run.log
            research/mnq_h12_tail_defense_holdout_2026q1_contract.json
            research/mnq_h12_tail_defense_holdout_2026q1.py
          if-no-files-found: warn
          retention-days: 30
