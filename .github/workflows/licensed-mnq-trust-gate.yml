name: licensed-mnq-trust-gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout research harness
        uses: actions/checkout@v4

      - name: Verify and acquire licensed MNQ source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.kaggle.com/api/v1/datasets/view/brandenmorris/mnq-1m-q4-2022-q4-2025-ts-ohlcv-sym' \
            -o source/metadata.json
          python - <<'PY'
          import json
          d=json.load(open('source/metadata.json', encoding='utf-8'))
          text=json.dumps(d, sort_keys=True)
          if 'CC BY 4.0' not in text:
              raise SystemExit('expected CC BY 4.0 metadata not observed')
          version=d.get('currentVersionNumber') or d.get('versionNumber')
          if str(version) != '1':
              raise SystemExit(f'dataset version drift: {version}')
          print('LICENSE_VERSION=PASS')
          PY
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.kaggle.com/api/v1/datasets/download/brandenmorris/mnq-1m-q4-2022-q4-2025-ts-ohlcv-sym' \
            -o source/mnq.zip
          echo '633eb4338a3aa60aedb542b12085acca29ff237c7cadff65442a638466f37667  source/mnq.zip' | sha256sum -c -
          unzip -q source/mnq.zip -d source/extracted
          aggregate="$(find source/extracted -type f -name 'mnq-ohlcv-1m.csv' -print -quit)"
          test -n "$aggregate"
          test -s "$aggregate"
          cp "$aggregate" source/mnq-ohlcv-1m.csv
          echo 'LICENSED_MNQ_SOURCE=PASS'

      - name: Install bounded research dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check -q pandas numpy scikit-learn

      - name: Execute multi-year trust-gate falsification
        shell: bash
        run: |
          set -euo pipefail
          python -m research.licensed_mnq_trust_gate \
            --aggregate source/mnq-ohlcv-1m.csv \
            --output result/licensed-mnq-trust-gate.json

      - name: Upload metrics only
        uses: actions/upload-artifact@v4
        with:
          name: licensed-mnq-trust-gate-results
          path: result/licensed-mnq-trust-gate.json
          if-no-files-found: error
          retention-days: 14
