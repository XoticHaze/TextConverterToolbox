name: package-mnq-public-corpus
on:
  pull_request:
    paths:
      - '.github/workflows/package-mnq-public-corpus.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned MNQ data
        uses: actions/checkout@v4
        with:
          repository: mbytes21/MNQ_DATA
          ref: fc5508e2c152938d6d9eb70a36b888ae26107176
          path: mnq-data
          sparse-checkout: |
            plaintext_csv
          sparse-checkout-cone-mode: false
      - name: Verify pinned anchor
        shell: bash
        run: |
          set -euo pipefail
          test -f 'mnq-data/plaintext_csv/MNQ 06-19/20190505.Last.csv'
          test "$(git -C mnq-data rev-parse HEAD)" = 'fc5508e2c152938d6d9eb70a36b888ae26107176'
          find mnq-data/plaintext_csv -name '*.Last.csv' -type f | sort > mnq-last-files.txt
          echo "MNQ_LAST_FILE_COUNT=$(wc -l < mnq-last-files.txt)"
      - name: Upload pinned public corpus
        uses: actions/upload-artifact@v4
        with:
          name: mnq-public-last-csv-fc5508
          path: |
            mnq-data/plaintext_csv/**/*.Last.csv
            mnq-last-files.txt
          if-no-files-found: error
          retention-days: 1
# disposable transfer branch
