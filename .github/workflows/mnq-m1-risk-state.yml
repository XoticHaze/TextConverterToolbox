name: MNQ corrected 1Min fast risk-state discovery

on:
  pull_request:
    branches: [assistant/mnq-m1-expected-move-r1]
    paths:
      - 'research/mnq_m1_risk_state.py'
      - 'research/mnq_m1_risk_state_contract_20260901.json'
      - 'research/deep_mnq_source_contract.py'
      - 'research/mnq_external_transfer_validation.py'
      - '.github/workflows/mnq-m1-risk-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  risk-state:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate frozen fast-risk contract and corrected source
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool research/mnq_m1_risk_state_contract_20260901.json >/dev/null
          python -m py_compile research/mnq_m1_risk_state.py research/deep_mnq_source_contract.py research/mnq_external_transfer_validation.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/mnq_m1_risk_state_contract_20260901.json').read_text())
          assert d['created_before_outcome_inspection'] is True
          assert d['bar_minutes'] == 1
          assert d['horizons'] == [12, 24]
          assert set(d['targets']) == {'long_mae_z','short_mae_z','future_rv_z'}
          assert d['validation']['full_horizon_purge'] is True
          assert d['validation']['post_hoc_horizon_or_target_selection'] is False
          assert d['tuning_allowed'] is False
          assert d['live_authority'] is False
          assert 'America/New_York' in d['source']['timestamp_contract']
          print('M1_FAST_RISK_FROZEN_CONTRACT=PASS')
          PY

      - name: Install bounded research dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy scikit-learn tzdata

      - name: Fetch pinned deep MNQ corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/MNQ_DATA
          git -C vendor/MNQ_DATA init
          git -C vendor/MNQ_DATA remote add origin https://github.com/mbytes21/MNQ_DATA.git
          git -C vendor/MNQ_DATA fetch --depth=1 origin fc5508e2c152938d6d9eb70a36b888ae26107176
          git -C vendor/MNQ_DATA checkout --detach FETCH_HEAD
          test "$(git -C vendor/MNQ_DATA rev-parse HEAD)" = "fc5508e2c152938d6d9eb70a36b888ae26107176"
          echo 'DEEP_MNQ_PIN=PASS'

      - name: Execute frozen corrected 1Min fast-risk study
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/m1-risk-state
          python -m research.mnq_m1_risk_state \
            --deep-root vendor/MNQ_DATA/plaintext_csv \
            --output artifacts/m1-risk-state/receipt.json \
            2>&1 | tee artifacts/m1-risk-state/run.log
          rc=${PIPESTATUS[0]}
          echo "M1_FAST_RISK_EXIT_CODE=$rc" | tee -a artifacts/m1-risk-state/run.log
          exit "$rc"

      - name: Verify corrected timestamp provenance
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/m1-risk-state/receipt.json').read_text())
          c=d['deep_timestamp_contract']
          assert c['source_timestamp_timezone'] == 'America/New_York'
          assert c['source_bar_label'] == 'right_close'
          assert c['normalized_timestamp'] == 'UTC bar start'
          assert sorted(d['horizons']) == ['12','24']
          assert sorted(d['decisions']) == ['12','24']
          for h in ('12','24'):
              assert set(d['decisions'][h]) == {'long_mae_z','short_mae_z','future_rv_z'}
          print('M1_FAST_RISK_TIMEFIXED_PROVENANCE=PASS')
          PY

      - name: Upload fast-risk receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnq-m1-fast-risk-state
          path: |
            artifacts/m1-risk-state/receipt.json
            artifacts/m1-risk-state/run.log
            research/mnq_m1_risk_state_contract_20260901.json
          if-no-files-found: warn
          retention-days: 30
