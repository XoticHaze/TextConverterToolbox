name: MNQ H24 MAE Yahoo Jul-Aug transfer

on:
  pull_request:
    paths:
      - 'research/mnq_h24_mae_yahoo_julaug_transfer.py'
      - 'research/mnq_h24_mae_gate_semantics.py'
      - '.github/workflows/mnq-h24-mae-yahoo-julaug.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn tzdata 'yfinance>=0.2.54,<0.3'
      - name: Fetch pinned corrected deep MNQ corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/MNQ_DATA
          git -C vendor/MNQ_DATA init
          git -C vendor/MNQ_DATA remote add origin https://github.com/mbytes21/MNQ_DATA.git
          git -C vendor/MNQ_DATA fetch --depth=1 origin fc5508e2c152938d6d9eb70a36b888ae26107176
          git -C vendor/MNQ_DATA checkout --detach FETCH_HEAD
          test "$(git -C vendor/MNQ_DATA rev-parse HEAD)" = "fc5508e2c152938d6d9eb70a36b888ae26107176"
      - name: Execute untouched post-AXB Jul-Aug transfer and stratification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mae-yahoo-julaug
          python -m research.mnq_h24_mae_yahoo_julaug_transfer \
            --deep-root vendor/MNQ_DATA/plaintext_csv \
            --output artifacts/mae-yahoo-julaug/receipt.json
      - name: Normalize inclusive floating gate boundary semantics
        shell: bash
        run: |
          set -euo pipefail
          python -m research.mnq_h24_mae_gate_semantics \
            --input artifacts/mae-yahoo-julaug/receipt.json \
            --output artifacts/mae-yahoo-julaug/receipt.normalized.json
      - uses: actions/upload-artifact@v4
        with:
          name: mnq-h24-mae-yahoo-julaug-transfer
          path: |
            artifacts/mae-yahoo-julaug/receipt.json
            artifacts/mae-yahoo-julaug/receipt.normalized.json
          if-no-files-found: error
          retention-days: 30
