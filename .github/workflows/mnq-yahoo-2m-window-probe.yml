name: MNQ Yahoo 2m window probe

on:
  pull_request:
    paths:
      - 'research/mnq_yahoo_2m_window_probe.py'
      - '.github/workflows/mnq-yahoo-2m-window-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-probe dependencies only
        run: python -m pip install --disable-pip-version-check numpy pandas 'yfinance>=0.2.54,<0.3'
      - name: Probe fixed chunked MNQ 2m window
        run: |
          mkdir -p artifacts/yahoo-window-probe
          python -m research.mnq_yahoo_2m_window_probe \
            --output artifacts/yahoo-window-probe/receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: mnq-yahoo-2m-window-probe
          path: artifacts/yahoo-window-probe/receipt.json
          if-no-files-found: error
          retention-days: 14
