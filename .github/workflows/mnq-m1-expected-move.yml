name: MNQ corrected 1Min expected-move discovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/mnq_m1_expected_move.py'
      - 'research/mnq_m1_expected_move_contract_20260901.json'
      - 'research/deep_mnq_source_contract.py'
      - 'research/mnq_external_transfer_validation.py'
      - '.github/workflows/mnq-m1-expected-move.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expected-move:
    strategy:
      fail-fast: false
      matrix:
        config: [m1_h30, m1_h60]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate frozen contract and corrected source
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool research/mnq_m1_expected_move_contract_20260901.json >/dev/null
          python -m py_compile research/mnq_m1_expected_move.py research/deep_mnq_source_contract.py research/mnq_external_transfer_validation.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/mnq_m1_expected_move_contract_20260901.json').read_text())
          assert d['created_before_outcome_inspection'] is True
          assert d['bar_minutes'] == 1
          assert sorted(d['configs']) == ['m1_h30','m1_h60']
          assert d['tuning_allowed'] is False
          assert d['live_authority'] is False
          assert 'America/New_York' in d['timestamp_contract']
          print('M1_EXPECTED_MOVE_FROZEN_CONTRACT=PASS')
          PY

      - name: Install bounded research dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy scikit-learn tzdata

      - name: Fetch pinned deep MNQ corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/MNQ_DATA
          git -C vendor/MNQ_DATA init
          git -C vendor/MNQ_DATA remote add origin https://github.com/mbytes21/MNQ_DATA.git
          git -C vendor/MNQ_DATA fetch --depth=1 origin fc5508e2c152938d6d9eb70a36b888ae26107176
          git -C vendor/MNQ_DATA checkout --detach FETCH_HEAD
          test "$(git -C vendor/MNQ_DATA rev-parse HEAD)" = "fc5508e2c152938d6d9eb70a36b888ae26107176"
          echo 'DEEP_MNQ_PIN=PASS'

      - name: Execute frozen corrected 1Min expected-move config
        shell: bash
        env:
          CONFIG_KEY: ${{ matrix.config }}
        run: |
          set -uo pipefail
          mkdir -p "artifacts/$CONFIG_KEY"
          python -m research.mnq_m1_expected_move \
            --config-key "$CONFIG_KEY" \
            --deep-root vendor/MNQ_DATA/plaintext_csv \
            --output "artifacts/$CONFIG_KEY/receipt.json" \
            2>&1 | tee "artifacts/$CONFIG_KEY/run.log"
          rc=${PIPESTATUS[0]}
          echo "M1_EXPECTED_MOVE_EXIT_CODE=$rc" | tee -a "artifacts/$CONFIG_KEY/run.log"
          exit "$rc"

      - name: Verify corrected timestamp provenance
        if: success()
        shell: bash
        env:
          CONFIG_KEY: ${{ matrix.config }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('artifacts')/os.environ['CONFIG_KEY']/'receipt.json'
          d=json.loads(p.read_text())
          c=d['deep_timestamp_contract']
          assert c['source_timestamp_timezone'] == 'America/New_York'
          assert c['source_bar_label'] == 'right_close'
          assert c['normalized_timestamp'] == 'UTC bar start'
          print('M1_EXPECTED_MOVE_TIMEFIXED_PROVENANCE=PASS')
          PY

      - name: Upload config receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnq-m1-expected-move-${{ matrix.config }}
          path: |
            artifacts/${{ matrix.config }}/receipt.json
            artifacts/${{ matrix.config }}/run.log
            research/mnq_m1_expected_move_contract_20260901.json
          if-no-files-found: warn
          retention-days: 30
