name: MNQ 1H risk-state specialists

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/mnq_h1_risk_state.py'
      - 'research/mnq_h1_risk_state_timefixed.py'
      - 'research/deep_mnq_source_contract.py'
      - 'research/mnq_h1_risk_state_contract_20260901.json'
      - '.github/workflows/mnq-h1-risk-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  risk-state:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate frozen contract and corrected source wrapper
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool research/mnq_h1_risk_state_contract_20260901.json >/dev/null
          python -m py_compile \
            research/mnq_h1_risk_state.py \
            research/mnq_h1_risk_state_timefixed.py \
            research/deep_mnq_source_contract.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/mnq_h1_risk_state_contract_20260901.json').read_text())
          assert d['created_before_outcome_inspection'] is True
          assert d['market'] == 'MNQ'
          assert d['bar_minutes'] == 60
          assert d['horizons'] == [4, 12]
          assert d['tuning_allowed'] is False
          assert d['nq_boundary'].startswith('NQ is excluded')
          print('H1_RISK_FROZEN_CONTRACT=PASS')
          PY

      - name: Install bounded research dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy scikit-learn tzdata

      - name: Fetch pinned deep MNQ corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/MNQ_DATA
          git -C vendor/MNQ_DATA init
          git -C vendor/MNQ_DATA remote add origin https://github.com/mbytes21/MNQ_DATA.git
          git -C vendor/MNQ_DATA fetch --depth=1 origin fc5508e2c152938d6d9eb70a36b888ae26107176
          git -C vendor/MNQ_DATA checkout --detach FETCH_HEAD
          test "$(git -C vendor/MNQ_DATA rev-parse HEAD)" = "fc5508e2c152938d6d9eb70a36b888ae26107176"
          echo 'DEEP_MNQ_PIN=PASS'

      - name: Execute frozen 1H risk-state specialists with corrected timestamps
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/h1-risk-state
          python -m research.mnq_h1_risk_state_timefixed \
            --deep-root vendor/MNQ_DATA/plaintext_csv \
            --output artifacts/h1-risk-state/receipt.json \
            2>&1 | tee artifacts/h1-risk-state/run.log
          rc=${PIPESTATUS[0]}
          echo "H1_RISK_STATE_TIMEFIXED_EXIT_CODE=$rc" | tee -a artifacts/h1-risk-state/run.log
          exit "$rc"

      - name: Verify corrected timestamp provenance
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/h1-risk-state/receipt.json').read_text())
          assert d['timestamp_correction_generation'] == 'timefixed_r1'
          c=d['deep_timestamp_contract']
          assert c['source_timestamp_timezone'] == 'America/New_York'
          assert c['source_bar_label'] == 'right_close'
          assert c['normalized_timestamp'] == 'UTC bar start'
          print('H1_RISK_TIMEFIXED_PROVENANCE=PASS')
          PY

      - name: Upload risk-state receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnq-h1-risk-state-timefixed
          path: |
            artifacts/h1-risk-state/receipt.json
            artifacts/h1-risk-state/run.log
            research/mnq_h1_risk_state_contract_20260901.json
          if-no-files-found: warn
          retention-days: 30
