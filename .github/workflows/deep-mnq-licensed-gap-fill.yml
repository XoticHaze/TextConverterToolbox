name: Deep MNQ licensed gap fill

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/deep_mnq_licensed_gap_fill.py'
      - 'research/deep_mnq_licensed_gap_fill_contract_20260901.json'
      - 'research/deep_mnq_source_contract.py'
      - 'research/licensed_mnq_expanded_validation.py'
      - '.github/workflows/deep-mnq-licensed-gap-fill.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate frozen repair contract and source
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool research/deep_mnq_licensed_gap_fill_contract_20260901.json >/dev/null
          python -m py_compile research/deep_mnq_licensed_gap_fill.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/deep_mnq_licensed_gap_fill_contract_20260901.json').read_text())
          assert d['created_before_union_outcome_inspection'] is True
          assert d['primary_source']['commit'] == 'fc5508e2c152938d6d9eb70a36b888ae26107176'
          assert d['fill_source']['version'] == 1
          assert d['fill_source']['license'] == 'CC BY 4.0'
          assert d['fill_source']['zip_sha256'] == '633eb4338a3aa60aedb542b12085acca29ff237c7cadff65442a638466f37667'
          print('FROZEN_GAP_FILL_CONTRACT=PASS')
          PY

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy scikit-learn tzdata

      - name: Fetch pinned deep MNQ primary source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/deep
          git -C source/deep init
          git -C source/deep remote add origin https://github.com/mbytes21/MNQ_DATA.git
          git -C source/deep fetch --depth=1 origin fc5508e2c152938d6d9eb70a36b888ae26107176
          git -C source/deep checkout --detach FETCH_HEAD
          test "$(git -C source/deep rev-parse HEAD)" = "fc5508e2c152938d6d9eb70a36b888ae26107176"
          echo 'DEEP_MNQ_PRIMARY_PIN=PASS'

      - name: Fetch and verify licensed MNQ fill source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/licensed
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.kaggle.com/api/v1/datasets/view/brandenmorris/mnq-1m-q4-2022-q4-2025-ts-ohlcv-sym' \
            -o source/licensed/metadata.json
          python - <<'PY'
          import json
          d=json.load(open('source/licensed/metadata.json', encoding='utf-8'))
          text=json.dumps(d, sort_keys=True)
          if 'CC BY 4.0' not in text:
              raise SystemExit('expected CC BY 4.0 metadata not observed')
          version=d.get('currentVersionNumber') or d.get('versionNumber')
          if str(version) != '1':
              raise SystemExit(f'dataset version drift: {version}')
          print('LICENSED_MNQ_METADATA=PASS')
          PY
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.kaggle.com/api/v1/datasets/download/brandenmorris/mnq-1m-q4-2022-q4-2025-ts-ohlcv-sym' \
            -o source/licensed/mnq.zip
          echo '633eb4338a3aa60aedb542b12085acca29ff237c7cadff65442a638466f37667  source/licensed/mnq.zip' | sha256sum -c -
          unzip -q source/licensed/mnq.zip -d source/licensed/extracted
          aggregate="$(find source/licensed/extracted -type f -name 'mnq-ohlcv-1m.csv' -print -quit)"
          test -n "$aggregate"
          test -s "$aggregate"
          cp "$aggregate" source/licensed/mnq-ohlcv-1m.csv
          echo 'LICENSED_MNQ_FILL_PIN=PASS'

      - name: Execute provenance-safe union repair
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/gap-fill
          python -m research.deep_mnq_licensed_gap_fill \
            --deep-root source/deep/plaintext_csv \
            --licensed-aggregate source/licensed/mnq-ohlcv-1m.csv \
            --output artifacts/gap-fill/receipt.json \
            2>&1 | tee artifacts/gap-fill/run.log
          rc=${PIPESTATUS[0]}
          echo "GAP_FILL_EXIT_CODE=$rc" | tee -a artifacts/gap-fill/run.log
          exit "$rc"

      - name: Verify accepted union receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/gap-fill/receipt.json').read_text())
          assert d['accepted_for_full_calendar_revalidation'] is True
          assert d['overlap_audit']['pass'] is True
          assert d['post_union_gap_gate']['pass'] is True
          assert d['coverage_gate']['q4_12min_support_2023_2025'] is True
          assert d['filled_minutes'] > 0
          print('DEEP_MNQ_LICENSED_UNION_RECEIPT=PASS')
          PY

      - name: Upload compact repair evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-mnq-licensed-gap-fill-receipt
          path: |
            artifacts/gap-fill/receipt.json
            artifacts/gap-fill/run.log
            research/deep_mnq_licensed_gap_fill_contract_20260901.json
          if-no-files-found: warn
          retention-days: 30
