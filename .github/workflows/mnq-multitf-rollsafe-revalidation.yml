name: MNQ multi-timeframe roll-safe revalidation

on:
  pull_request:
    branches: [assistant/mnq-ridge-h1-opportunity-risk-r1]
    paths:
      - 'research/mnq_multitf_rollsafe_revalidation.py'
      - 'research/mnq_multitf_rollsafe_revalidation_contract_20260901.json'
      - '.github/workflows/mnq-multitf-rollsafe-revalidation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate frozen roll-safe integrity contract
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool research/mnq_multitf_rollsafe_revalidation_contract_20260901.json >/dev/null
          python -m py_compile research/mnq_multitf_rollsafe_revalidation.py research/mnq_ridge_h1_mae_orchestration.py research/mnq_ridge_h1_risk_budget.py research/mnq_ridge_h1_opportunity_risk.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/mnq_multitf_rollsafe_revalidation_contract_20260901.json').read_text())
          assert d['created_before_corrected_outcome_inspection'] is True
          assert d['roll_safe_join']['required_same_source_contract'] is True
          assert d['roll_safe_join']['cross_contract_score_carry_forbidden'] is True
          assert set(d['consumers_to_revalidate']) == {
              'binary_q80_mae_veto',
              'pure_inverse_mae_budget',
              'opportunity_to_mae_budget',
          }
          assert d['tuning_allowed'] is False
          assert d['live_authority'] is False
          print('MULTITF_ROLLSAFE_FROZEN_CONTRACT=PASS')
          PY

      - name: Install bounded research dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy scikit-learn tzdata

      - name: Fetch pinned deep MNQ corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/MNQ_DATA
          git -C vendor/MNQ_DATA init
          git -C vendor/MNQ_DATA remote add origin https://github.com/mbytes21/MNQ_DATA.git
          git -C vendor/MNQ_DATA fetch --depth=1 origin fc5508e2c152938d6d9eb70a36b888ae26107176
          git -C vendor/MNQ_DATA checkout --detach FETCH_HEAD
          test "$(git -C vendor/MNQ_DATA rev-parse HEAD)" = "fc5508e2c152938d6d9eb70a36b888ae26107176"
          echo 'DEEP_MNQ_PIN=PASS'

      - name: Checkout exact timestamp-corrected 1H risk prerequisite
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/XoticHaze/TextConverterToolbox.git risk-prereq
          git -C risk-prereq checkout --detach d2e1e0c4fd80235a76b0969a249f90eeb7b227d1
          test "$(git -C risk-prereq rev-parse HEAD)" = "d2e1e0c4fd80235a76b0969a249f90eeb7b227d1"
          grep -q 'python -m research.mnq_h1_risk_state_timefixed' risk-prereq/.github/workflows/mnq-h1-risk-state.yml
          echo 'H1_RISK_PREREQ_PIN=PASS'

      - name: Execute and verify corrected 1H risk prerequisite
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/prerequisite
          cd risk-prereq
          python -m research.mnq_h1_risk_state_timefixed \
            --deep-root ../vendor/MNQ_DATA/plaintext_csv \
            --output ../artifacts/prerequisite/h1-risk-timefixed.json \
            2>&1 | tee ../artifacts/prerequisite/h1-risk-timefixed.log
          rc=${PIPESTATUS[0]}
          cd ..
          test "$rc" -eq 0
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/prerequisite/h1-risk-timefixed.json').read_text())
          assert d['timestamp_correction_generation'] == 'timefixed_r1'
          assert d['deep_timestamp_contract']['source_timestamp_timezone'] == 'America/New_York'
          assert d['deep_timestamp_contract']['normalized_timestamp'] == 'UTC bar start'
          for target in ('long_mae_z','short_mae_z','future_rv_z'):
              assert d['decisions']['4'][target]['action'] == 'advance_to_separate_economic_consumer'
          print('H1_RISK_TIMEFIXED_PREREQUISITE=PASS')
          PY

      - name: Execute roll-safe revalidation
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/rollsafe
          python -m research.mnq_multitf_rollsafe_revalidation \
            --deep-root vendor/MNQ_DATA/plaintext_csv \
            --risk-prereq-receipt artifacts/prerequisite/h1-risk-timefixed.json \
            --output artifacts/rollsafe/revalidation.json \
            2>&1 | tee artifacts/rollsafe/revalidation.log
          rc=${PIPESTATUS[0]}
          echo "MULTITF_ROLLSAFE_EXIT_CODE=$rc" | tee -a artifacts/rollsafe/revalidation.log
          exit "$rc"

      - name: Verify roll-safe provenance and legacy seam evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/rollsafe/revalidation.json').read_text())
          i=d['integrity']
          assert i['legacy_cross_contract_rows'] > 0
          assert i['legacy_cross_contract_selected_signals'] > 0
          assert i['non_neutral_source_contract_mismatches'] == 0
          assert set(d['decision']) == {
              'binary_q80_mae_veto',
              'pure_inverse_mae_budget',
              'opportunity_to_mae_budget',
          }
          assert d['deep_timestamp_contract']['normalized_timestamp'] == 'UTC bar start'
          print('MULTITF_ROLLSAFE_PROVENANCE=PASS')
          PY

      - name: Upload roll-safe revalidation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mnq-multitf-rollsafe-revalidation
          path: |
            artifacts/prerequisite/h1-risk-timefixed.json
            artifacts/prerequisite/h1-risk-timefixed.log
            artifacts/rollsafe/revalidation.json
            artifacts/rollsafe/revalidation.log
            research/mnq_multitf_rollsafe_revalidation_contract_20260901.json
            research/mnq_multitf_rollsafe_revalidation.py
          if-no-files-found: warn
          retention-days: 30
